name: fleurapp_mobile
description: "Caisse mobile Flutter connectée au backend FleurApp."
publish_to: "none"
version: 1.4.11+2019

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # La v10 a assuré la migration AES-CBC vers AES-GCM. La v11 retire
  # définitivement l’ancien chiffrement du binaire Android.
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^22.3.0
  device_info_plus: ^13.2.0
  file_picker: ^12.0.0
  http: ^1.6.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: production
  uses-material-design: true
