name: QA FleurApp Mobile

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    name: Analyse, tests et APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Installer Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Adapter uniquement le chemin Java du runner
        run: sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" android/gradle.properties

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyser le code
        run: flutter analyze

      - name: Exécuter les tests Flutter
        run: flutter test

      - name: Compiler l’APK de test
        run: >-
          flutter build apk --debug --flavor qa --no-pub
          --dart-define=ALLOW_SERVER_CONFIGURATION=true

      - name: Conserver l’APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleurapp-mobile-debug
          path: build/app/outputs/flutter-apk/app-qa-debug.apk
          if-no-files-found: error
          retention-days: 14

  semgrep:
    name: Analyse statique Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:296fc4912420833abfcf5090ec49a81bf1330bb61fc193cd09255f88b8267ba9

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Analyser Flutter, Android et le workflow
        run: >-
          semgrep scan --config auto --error
          --exclude .dart_tool --exclude build --exclude ios/Pods
          --exclude android/.gradle
